name: Deploy Hugging Face Space

on:
  push:
    branches:
      - master
    paths:
      - 'hf-space-chatbot/**'
      - '.github/workflows/hf-space-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-hf-space:
    name: Deploy and restart Hugging Face Space
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Deploy hf-space-chatbot to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import tempfile
          from pathlib import Path
          from huggingface_hub import HfApi, Repository

          token = os.getenv('HF_TOKEN')
          if not token:
              raise SystemExit('HF_TOKEN secret is required for Hugging Face deployment')

          repo_id = 'Habib-HF/alhaq-website-chatbot'
          source_dir = Path('hf-space-chatbot').resolve()
          if not source_dir.exists():
              raise SystemExit(f"Source directory not found: {source_dir}")

          api = HfApi(token=token)
          try:
              api.space_info(repo_id)
          except Exception:
              api.create_repo(repo_id=repo_id, repo_type='space', private=False, exist_ok=True)

          with tempfile.TemporaryDirectory() as tmpdir:
              clone_dir = Path(tmpdir) / 'space'
              repo = Repository(
                  local_dir=clone_dir,
                  clone_from=repo_id,
                  repo_type='space',
                  use_auth_token=token,
              )

              for child in clone_dir.iterdir():
                  if child.name == '.git':
                      continue
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()

              def copy_tree(src: Path, dest: Path):
                  if src.is_dir():
                      dest.mkdir(parents=True, exist_ok=True)
                      for item in src.iterdir():
                          copy_tree(item, dest / item.name)
                  else:
                      shutil.copy2(src, dest)

              copy_tree(source_dir, clone_dir)

              repo.git_add(auto_lfs_track=True)
              repo.git_commit(f'Deploy hf-space-chatbot from GitHub commit {os.getenv("GITHUB_SHA", "unknown")}')
              repo.git_push()

          api.restart_space(repo_id)
          print('Hugging Face Space deployment and restart requested.')
          PY

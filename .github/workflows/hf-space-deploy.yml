name: Deploy Hugging Face Space

on:
  push:
    branches:
      - master
    paths:
      - 'hf-space-chatbot/**'
      - '.github/workflows/hf-space-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-hf-space:
    name: Deploy and restart Hugging Face Space
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface_hub>=0.23"

      - name: Deploy hf-space-chatbot to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.getenv('HF_TOKEN')
          if not token:
              raise SystemExit('HF_TOKEN secret is required for Hugging Face deployment')

          repo_id = 'Habib-HF/alhaq-website-chatbot'
          source_dir = Path('hf-space-chatbot').resolve()
          if not source_dir.exists():
              raise SystemExit(f"Source directory not found: {source_dir}")

          api = HfApi(token=token)

          # Create the Space if it doesn't exist yet
          try:
              api.space_info(repo_id)
              print(f"Space '{repo_id}' already exists.")
          except Exception:
              api.create_repo(
                  repo_id=repo_id,
                  repo_type='space',
                  space_sdk='gradio',
                  private=False,
                  exist_ok=True,
              )
              print(f"Created Space '{repo_id}'.")

          # Upload the entire hf-space-chatbot/ folder in one API call.
          # huggingface_hub >= 0.20 — no Repository / git clone needed.
          api.upload_folder(
              folder_path=str(source_dir),
              repo_id=repo_id,
              repo_type='space',
              commit_message=f"Deploy from GitHub commit {os.getenv('GITHUB_SHA', 'unknown')}",
              ignore_patterns=['__pycache__', '*.pyc', '.DS_Store'],
          )
          print('Files uploaded successfully.')

          # Restart so the Space picks up the new site_index.json immediately
          api.restart_space(repo_id)
          print('Hugging Face Space restart requested.')
          PY

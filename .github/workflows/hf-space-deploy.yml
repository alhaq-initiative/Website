name: Deploy Hugging Face Space

on:
  push:
    branches:
      - master
    paths:
      - 'hf-space-chatbot/**'
      - '.github/workflows/hf-space-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-hf-space:
    name: Deploy and restart Hugging Face Space
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface_hub>=0.23"

      - name: Deploy hf-space-chatbot to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGINGFACEHUB_API_TOKEN }}
          HF_SPACE_REPO_ID: ${{ vars.HF_SPACE_REPO_ID || 'Alhaq-HF/alhaq-website-chatbot' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub.errors import RepositoryNotFoundError
          from huggingface_hub import HfApi

          token = os.getenv('HF_TOKEN')
          if not token:
              raise SystemExit(
                  'A Hugging Face token secret is required. Set one of: '
                  'HF_TOKEN, HUGGINGFACE_TOKEN, or HUGGINGFACEHUB_API_TOKEN.'
              )

          repo_id = os.getenv('HF_SPACE_REPO_ID', '').strip() or 'Alhaq-HF/alhaq-website-chatbot'
          source_dir = Path('hf-space-chatbot').resolve()
          if not source_dir.exists():
              raise SystemExit(f"Source directory not found: {source_dir}")

          api = HfApi(token=token)

          # Preflight identity to make namespace permission issues explicit.
          try:
              who = api.whoami(token=token)
              user = who.get('name') or who.get('fullname') or 'unknown'
              orgs = ', '.join((who.get('orgs') or [])) or '(none)'
              print(f"Authenticated as: {user}")
              print(f"Token org memberships: {orgs}")
          except Exception as exc:  # pylint: disable=broad-except
              raise SystemExit(
                  'HF token authentication failed. Verify the token value and scope.'
              ) from exc

          # Update-only mode: the target Space must already exist and be accessible
          # to the provided token. This avoids accidental create attempts.
          try:
              api.space_info(repo_id)
          except RepositoryNotFoundError as exc:
              raise SystemExit(
                  f"Target Space '{repo_id}' is not accessible with this token. "
                  "Confirm the repo_id (set HF_SPACE_REPO_ID repo variable if needed) and ensure the token has write access."
              ) from exc

          print(f"Space '{repo_id}' is accessible. Starting upload.")

          # Upload the entire hf-space-chatbot/ folder in one API call.
          # huggingface_hub >= 0.20 — no Repository / git clone needed.
          api.upload_folder(
              folder_path=str(source_dir),
              repo_id=repo_id,
              repo_type='space',
              commit_message=f"Deploy from GitHub commit {os.getenv('GITHUB_SHA', 'unknown')}",
              ignore_patterns=['__pycache__', '*.pyc', '.DS_Store'],
          )
          print('Files uploaded successfully.')

          # Restart so the Space picks up the new site_index.json immediately
          api.restart_space(repo_id)
          print('Hugging Face Space restart requested.')
          PY
